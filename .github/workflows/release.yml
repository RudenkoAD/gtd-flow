name: Release

# Every pushed tag is verified against package.json/manifest.json/versions.json.
# Non-SemVer or mismatched tags fail before a release can be published.
on:
  push:
    tags:
      - "*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      # actions/checkout v4.3.1
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      # actions/setup-node v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "20.19.0"
          cache: npm

      - run: npm ci
      - name: Install browser test runtime
        run: npx playwright install --with-deps chromium
      - name: Test, type-check, and build
        run: npm run verify
      - name: Validate tag and prepare immutable release bundle
        run: npm run prepare:release -- --tag "$GITHUB_REF_NAME"

      # actions/upload-artifact v4.6.2
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: gtd-flow-${{ github.ref_name }}
          path: dist/release/
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # actions/download-artifact v4.3.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: gtd-flow-${{ github.ref_name }}
          path: dist/release/

      - name: Verify artifact checksums
        working-directory: dist/release
        run: sha256sum --check SHA256SUMS

      - name: Publish verified GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_PREAMBLE: |
            **Breaking release:** runtime namespaces are replaced by one unified inbox and explicit task scopes; the plugin is now desktop-only and adds the opt-in AI Inbox MVP.

            Back up the vault before upgrading. Legacy namespace vaults must use the built-in dry-run, apply, resume, and rollback migration commands. [Read the full upgrade and privacy guide](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/docs/BREAKING_AI_INBOX_MVP.md).
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --notes "$RELEASE_PREAMBLE" \
            --verify-tag \
            --fail-on-no-commits \
            dist/release/main.js \
            dist/release/manifest.json \
            dist/release/styles.css \
            dist/release/mcp-server.js \
            dist/release/widget-core.js \
            dist/release/LICENSE \
            dist/release/SHA256SUMS
