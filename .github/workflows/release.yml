name: Release

# Every pushed tag is verified against package.json/manifest.json/versions.json.
# Non-SemVer or mismatched tags fail before a release can be published.
on:
  push:
    tags:
      - "*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      # actions/checkout v4.3.1
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      # actions/setup-node v4.4.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "20.19.0"
          cache: npm

      - run: npm ci
      - name: Install browser test runtime
        run: npx playwright install --with-deps chromium
      - name: Test, type-check, and build
        run: npm run verify
      - name: Validate tag and prepare immutable release bundle
        run: npm run prepare:release -- --tag "$GITHUB_REF_NAME"

      # actions/upload-artifact v4.6.2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gtd-flow-${{ github.ref_name }}
          path: dist/release/
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # actions/download-artifact v4.3.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: gtd-flow-${{ github.ref_name }}
          path: dist/release/

      - name: Verify artifact checksums
        working-directory: dist/release
        run: sha256sum --check SHA256SUMS

      - name: Publish verified GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The preamble comes from the verified bundle (docs/release-notes/<version>.md,
          # bundled by prepare-release and covered by SHA256SUMS) instead of being hard
          # coded here: a literal would ship one release's breaking notice with every
          # later tag. A whitespace-only file means "no notes for this version", so the
          # release keeps just the generated commit list.
          notes=(--generate-notes)
          if grep -q '[^[:space:]]' dist/release/RELEASE_NOTES.md; then
            notes+=(--notes-file dist/release/RELEASE_NOTES.md)
          fi
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            "${notes[@]}" \
            --verify-tag \
            --fail-on-no-commits \
            dist/release/main.js \
            dist/release/manifest.json \
            dist/release/styles.css \
            dist/release/mcp-server.js \
            dist/release/widget-core.js \
            dist/release/LICENSE \
            dist/release/SHA256SUMS
